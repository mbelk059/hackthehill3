<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bunny Buddy</title>
    <link rel="stylesheet" href="../popup/popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Bunny Buddy</h1>
        <p id="status">Ready when you are!</p>
      </div>
    </header>
    <p id="error" hidden></p>
    <div id="stage">
      <img id="mascot" alt="Bunny Buddy" src="../assets/mascot/idle.png" width="192" height="192" />
      <p id="caption" class="bubble" hidden></p>
      <button id="start" type="button">Let's go!</button>
      <div id="tools" hidden>
        <div class="modes">
          <button id="mode-calm" class="pill on" type="button">Bunny Buddy</button>
          <button id="mode-strict" class="pill" type="button">Strict Bunny</button>
          <button id="mode-nice" class="pill" type="button">Nice Bunny</button>
        </div>
        <button id="stop" class="quiet" type="button">Stop</button>
        <button id="dashboard" class="quiet" type="button">Dashboard</button>
      </div>
    </div>
    <script type="module" src="session.js"></script>
  </body>
</html>
